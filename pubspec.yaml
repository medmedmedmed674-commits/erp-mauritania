name: erp_mauritania
description: Enterprise-grade ERP & POS application tailored for the Mauritania commercial market. Retail, Wholesale, Inventory, B2B Ledger, Suppliers and Analytics in a single cross-platform Flutter app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Icons & visual helpers
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3

  # Cross-platform: launch WhatsApp / phone / mail / web URLs
  url_launcher: ^6.3.1

  # Cross-platform file picker (web + mobile + desktop) for product image upload
  file_picker: ^8.1.7

  # PDF generation + native print dialog (web + mobile + desktop)
  pdf: ^3.11.2
  printing: ^5.13.4

  # Saving rendered invoice PNG to disk on mobile/desktop
  path_provider: ^2.1.5

  # PostgreSQL client — used on mobile/desktop to connect directly to
  # the Neon database. NOTE: this package uses dart:io sockets, so it
  # does NOT work on Flutter Web (browsers can't open raw TCP
  # connections). The DatabaseService gracefully falls back to the
  # in-memory store on Web builds.
  postgres: ^3.4.8

  # Environment variables — used to read NEON_CONNECTION_STRING at
  # runtime without hardcoding the credentials in the source tree.
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - .env

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
    - family: CairoBold
      fonts:
        - asset: assets/fonts/Cairo-Bold.ttf
